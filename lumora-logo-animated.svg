<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Lumora animated logo intro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.a{transform-box:fill-box;transform-origin:center;animation:6s ease-in-out infinite}
.arc{stroke-dasharray:76;animation:draw 6s ease-in-out infinite}
.sun{animation-name:rise}.base{animation-name:base}
.w{animation:word 6s ease-in-out infinite;font:700 56px 'Sora',Helvetica,Arial,sans-serif;fill:#FFF7E8;text-anchor:middle}
@keyframes draw{0%{stroke-dashoffset:76}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:76}}
@keyframes rise{0%,10%{transform:translateY(14px) scale(.4);opacity:0}40%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes base{0%,25%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes word{0%,40%{opacity:0;letter-spacing:12px}60%,85%{opacity:1;letter-spacing:2px}100%{opacity:0}}
</style>
<rect width="640" height="360" rx="16" fill="#0E1B2C"/>
<g transform="translate(240 30) scale(2.5)">
<circle class="a sun" cx="32" cy="36" r="14" fill="#FFB020"/>
<path class="arc" d="M8 44A24 24 0 0 1 56 44" fill="none" stroke="#FFF7E8" stroke-width="5" stroke-linecap="round"/>
<path class="a base" d="M12 54H52" stroke="#2FB5B5" stroke-width="5" stroke-linecap="round"/>
</g>
<text class="w" x="320" y="290">Lumora</text>
</svg>
